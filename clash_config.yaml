mixed-port: 7890
mode: rule
external-controller: 127.0.0.1:9090
ipv6: true

# redir-host 的 IP -> 域名映射在多个域名共用同一 IP 时可能被覆盖。
# 对映射流量和纯 IP 流量强制嗅探，用 HTTP Host、TLS SNI 或 QUIC 域名校正目标。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: true
  enhanced-mode: redir-host

  proxy-server-nameserver: 
    - https://223.5.5.5/dns-query
  direct-nameserver: 
    - https://223.5.5.5/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  nameserver-policy:
    'rule-set:china': https://223.5.5.5/dns-query
    'geosite:cn': https://223.5.5.5/dns-query
    '+.cn': https://223.5.5.5/dns-query

  # 当前仍使用 redir-host；切换为 fake-ip 后，以下过滤规则会自动生效。
  # enhanced-mode: fake-ip
  # fake-ip-filter-mode: blacklist
  # fake-ip-filter:
  #   # Tailscale MagicDNS 必须返回真实的 tailnet IP，控制面和 DERP 也不应获得 fake IP。
  #   - +.ts.net
  #   - +.tailscale.com

  #   # 局域网、mDNS、反向解析等名称依赖本地或专用 DNS。
  #   - +.lan
  #   - +.local
  #   - +.localhost
  #   - +.home.arpa
  #   - +.arpa
  #   - WORKGROUP

  #   # STUN/ICE 和游戏联机需要在应用层拿到真实地址。
  #   - +.stun.*.*
  #   - +.stun.*.*.*
  #   - +.stun.*.*.*.*
  #   - +.stun.*.*.*.*.*
  #   - "*.n.n.srv.nintendo.net"
  #   - +.stun.playstation.net
  #   - xbox.*.*.microsoft.com
  #   - +.xboxlive.com

  #   # 网络连通性检测和校时不适合返回 fake IP。
  #   - geosite:connectivity-check
  #   - time.*.com
  #   - time.*.*.com
  #   - ntp.*.com
  #   - +.pool.ntp.org

rule-providers:
  youtube_api:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/youtube_api.yaml
    path: ./rulesets/youtube_api.yaml
    interval: 86400
  youtube_cdn:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/youtube_cdn.yaml
    path: ./rulesets/youtube_cdn.yaml
    interval: 86400
  microsoft:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft.yaml
    path: ./rulesets/microsoft.yaml
    interval: 86400
  china:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/china.yaml
    path: ./rulesets/china.yaml
    interval: 86400

rules:
  ## github
  - DOMAIN-KEYWORD,github,PROXY

  ## chatgpt
  - DOMAIN-KEYWORD,chatgpt,PROXY

  ## cloudflare
  - DOMAIN-SUFFIX,cloudflare.com,PROXY
    
  ## youtube
  - RULE-SET,youtube_cdn,PROXY
  - RULE-SET,youtube_api,PROXY

  ## microsoft
  - RULE-SET,microsoft,PROXY

  ## IP测试
  - DOMAIN-SUFFIX,ifconfig.me,PROXY
  
  ## 直连
  - RULE-SET,china,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  
  ## 广告阻止
  - GEOSITE,category-public-tracker,REJECT
  
  - MATCH,default
