mixed-port: 7890
mode: rule
external-controller: 127.0.0.1:9090
ipv6: true

# redir-host 的 IP -> 域名映射在多个域名共用同一 IP 时可能被覆盖。
# 对映射流量和纯 IP 流量强制嗅探，用 HTTP Host、TLS SNI 或 QUIC 域名校正目标。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: true
  enhanced-mode: redir-host

  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'

  # DIRECT 连接使用境内 DNS 重解析，避免经代理获得的境外 CDN 地址被直接连接。
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true

  nameserver:
    - 'https://1.1.1.1/dns-query#default'
    - 'https://8.8.8.8/dns-query#default'

  nameserver-policy:
    'rule-set:china':
      - 'https://223.5.5.5/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
    'geosite:cn':
      - 'https://223.5.5.5/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
    '+.cn':
      - 'https://223.5.5.5/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'

  # enhanced-mode: fake-ip
  # fake-ip-filter:
  #   - +.stun.*.*
  #   - +.stun.*.*.*
  #   - +.stun.*.*.*.*
  #   - +.stun.*.*.*.*.*
  #   - "*.n.n.srv.nintendo.net"
  #   - +.stun.playstation.net
  #   - xbox.*.*.microsoft.com
  #   - "*.*.xboxlive.com"
  #   - "*.msftncsi.com"
  #   - "*.msftconnecttest.com"
  #   - WORKGROUP

proxies: []

proxy-groups:
  - name: "default"
  - name: "specified"

rule-providers:
  youtube_api:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/youtube_api.yaml
    path: ./rulesets/youtube_api.yaml
    interval: 86400
  youtube_cdn:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/youtube_cdn.yaml
    path: ./rulesets/youtube_cdn.yaml
    interval: 86400
  microsoft:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft.yaml
    path: ./rulesets/microsoft.yaml
    interval: 86400
  china:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/china.yaml
    path: ./rulesets/china.yaml
    interval: 86400

rules:
  ## github
  - DOMAIN-KEYWORD,github,default

  ## chatgpt
  - DOMAIN-KEYWORD,chatgpt,default

  ## cloudflare
  - DOMAIN-SUFFIX,cloudflare.com,default
    
  ## youtube
  - RULE-SET,youtube_cdn,default
  - RULE-SET,youtube_api,specified

  ## microsoft
  - RULE-SET,microsoft,default

  ## IP测试
  - DOMAIN-SUFFIX,ifconfig.me,specified
  
  ## 直连
  - RULE-SET,china,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  
  ## 广告阻止
  - GEOSITE,category-public-tracker,REJECT
  
  - MATCH,default
