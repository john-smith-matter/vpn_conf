# Clash Verge Rev cloud profile. Local extensions supply nodes and replace default.
mode: rule
log-level: info
# Identify Tailscale even when it connects to changing public peer IPs.
find-process-mode: always
ipv6: true
mixed-port: 7890
external-controller: 127.0.0.1:9090

# Set TUN enable, routing and DNS hijack in Verge's UI; see README.
# In TUN settings, add route exclusions: 100.64.0.0/10 and fd7a:115c:a1e0::/48.
# Verge manages route-exclude-address; subscriptions and extensions cannot override it.
tun:
  # Verge's TUN settings do not manage this IPv6 interface address.
  inet6-address:
    - 'fdfe:dcba:9876::1/126'

# Retain redir-host; sniff HTTP Host / TLS SNI / QUIC for shared-IP domains.
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.local'
    - '+.lan'
    - '+.home.arpa'
    - '+.ts.net'

dns:
  enable: true
  listen: 127.0.0.1:53
  enhanced-mode: redir-host
  respect-rules: true
  ipv6: true
  # IP-address DoH bootstrap and node DNS avoid circular dependence on the proxy.
  default-nameserver: &domestic-dns
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  proxy-server-nameserver: *domestic-dns
  nameserver: &foreign-dns
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
  # Keep set order aligned with routing: proxy exceptions before domestic sets.
  # Do not add a standalone '+.cn' key: wildcard policies precede set policies.
  nameserver-policy:
    'rule-set:private': system
    'rule-set:proxy,microsoft': *foreign-dns
    'rule-set:china,china_public': *domestic-dns

# One classical/text URL per set, shared by all four clients. No generated files.
rule-providers:
  private:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/main/private.list
    path: ./rulesets/private.list
    proxy: default
    interval: 86400
  reject:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/main/reject.list
    path: ./rulesets/reject.list
    proxy: default
    interval: 86400
  public_tracker:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-public-tracker.list
    path: ./rulesets/public_tracker.list
    proxy: default
    interval: 86400
  proxy:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/main/proxy.list
    path: ./rulesets/proxy.list
    proxy: default
    interval: 86400
  microsoft:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/microsoft.list
    path: ./rulesets/microsoft.list
    proxy: default
    interval: 86400
  china:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/main/china.list
    path: ./rulesets/china.list
    proxy: default
    interval: 86400
  china_public:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list
    path: ./rulesets/china_public.list
    proxy: default
    interval: 86400
  china_ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/cncidr.txt
    path: ./rulesets/china_ip.list
    proxy: default
    interval: 86400

# Self-contained for subscription validation; no local node file is required.
# Replace these entries in Verge's local extension with real nodes/providers/groups.
proxies: []
proxy-providers: {}
proxy-groups:
  - name: default
    type: select
    proxies: [REJECT]

rules:
  # Transport bypass comes before all downloaded rules and MATCH.
  # Windows service, CLI and GUI.
  - PROCESS-NAME,tailscaled.exe,DIRECT
  - PROCESS-NAME,tailscale.exe,DIRECT
  - PROCESS-NAME,tailscale-ipn.exe,DIRECT
  # macOS: CLI daemon, GUI, App Store extension and standalone extension.
  - PROCESS-NAME,tailscaled,DIRECT
  - PROCESS-NAME,tailscale,DIRECT
  - PROCESS-NAME,Tailscale,DIRECT
  - PROCESS-NAME,IPNExtension,DIRECT
  - PROCESS-NAME,io.tailscale.ipn.macos,DIRECT
  - PROCESS-NAME,io.tailscale.ipn.macos.network-extension,DIRECT
  - PROCESS-NAME,io.tailscale.ipn.macsys,DIRECT
  - PROCESS-NAME,io.tailscale.ipn.macsys.network-extension,DIRECT
  # Android package matching requires client support; see README for VPN limits.
  - PROCESS-NAME,com.tailscale.ipn,DIRECT
  # Control/DERP hostname fallback; dynamic peer IPs need process matching above.
  - DOMAIN-SUFFIX,tailscale.com,DIRECT
  - DOMAIN-SUFFIX,tailscale.io,DIRECT
  - DOMAIN-SUFFIX,ts.net,DIRECT
  # Keep tailnet traffic independent of remote rule-provider availability.
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,fd7a:115c:a1e0::/48,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,public_tracker,REJECT
  - RULE-SET,proxy,default
  - RULE-SET,microsoft,default
  - RULE-SET,china,DIRECT
  - RULE-SET,china_public,DIRECT
  - RULE-SET,china_ip,DIRECT
  - MATCH,default
