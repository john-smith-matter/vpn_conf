# redir-host 的 IP -> 域名映射在多个域名共用同一 IP 时可能被覆盖。
# 对映射流量和纯 IP 流量强制嗅探，用 HTTP Host、TLS SNI 或 QUIC 域名校正目标。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: false
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - https://1.1.1.1/dns-query#default
    - https://1.0.0.1/dns-query#default

  nameserver-policy:
    'rule-set:china': https://223.5.5.5/dns-query
    'geosite:cn': https://223.5.5.5/dns-query
    '+.cn': https://223.5.5.5/dns-query
    
  enhanced-mode: redir-host
  
rule-providers:
  youtube_api:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/youtube_api.yaml
    path: ./rulesets/youtube_api.yaml
    interval: 86400
  youtube_cdn:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/youtube_cdn.yaml
    path: ./rulesets/youtube_cdn.yaml
    interval: 86400
  microsoft:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Microsoft/Microsoft.yaml
    path: ./rulesets/microsoft.yaml
    interval: 86400
  china:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/refs/heads/main/china.yaml
    path: ./rulesets/china.yaml
    interval: 86400

proxy-providers:
  usa:
    type: file
    path: ./proxy_providers/default_proxy.yaml

proxy-groups:
  - name: default
    type: select
    use:
      - usa
    proxies:
      - DIRECT

rules:
  ## github
  - DOMAIN-KEYWORD,github,default

  ## chatgpt
  - DOMAIN-KEYWORD,chatgpt,default
  - DOMAIN-SUFFIX,openai.com,default

  ## cloudflare
  - DOMAIN-SUFFIX,cloudflare.com,default
    
  ## youtube
  - RULE-SET,youtube_cdn,default
  - RULE-SET,youtube_api,default

  ## microsoft
  - RULE-SET,microsoft,default

  ## IP测试
  - DOMAIN-SUFFIX,ifconfig.me,default
  
  ## 直连
  - RULE-SET,china,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  
  ## 广告阻止
  - GEOSITE,category-public-tracker,REJECT
  
  - MATCH,default
