# Complete Mihomo cloud profile. Nodes are read from the core's local ./usa.yaml.
mode: rule
log-level: info
ipv6: false

# Retain redir-host; sniff HTTP Host / TLS SNI / QUIC for shared-IP domains.
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.local'
    - '+.lan'
    - '+.home.arpa'
    - '+.ts.net'

dns:
  enable: true
  listen: 127.0.0.1:53
  enhanced-mode: redir-host
  respect-rules: true
  ipv6: false
  # IP-address DoH bootstrap and node DNS avoid circular dependence on the proxy.
  default-nameserver: &domestic-dns
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  proxy-server-nameserver: *domestic-dns
  nameserver: &foreign-dns
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
  # Keep set order aligned with routing: proxy exceptions before domestic sets.
  # Do not add a standalone '+.cn' key: wildcard policies precede set policies.
  nameserver-policy:
    'rule-set:private': system
    'rule-set:proxy,microsoft': *foreign-dns
    'rule-set:china,china_public': *domestic-dns

# One classical/text URL per set, shared by all four clients. No generated files.
rule-providers:
  private:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/main/private.list
    path: ./rulesets/private.list
    proxy: default
    interval: 86400
  reject:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/main/reject.list
    path: ./rulesets/reject.list
    proxy: default
    interval: 86400
  public_tracker:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-public-tracker.list
    path: ./rulesets/public_tracker.list
    proxy: default
    interval: 86400
  proxy:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/main/proxy.list
    path: ./rulesets/proxy.list
    proxy: default
    interval: 86400
  microsoft:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/microsoft.list
    path: ./rulesets/microsoft.list
    proxy: default
    interval: 86400
  china:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/john-smith-matter/vpn_conf/main/china.list
    path: ./rulesets/china.list
    proxy: default
    interval: 86400
  china_public:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list
    path: ./rulesets/china_public.list
    proxy: default
    interval: 86400
  china_ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/cncidr.txt
    path: ./rulesets/china_ip.list
    proxy: default
    interval: 86400

# File providers load nodes independently of client-side profile overrides.
# ./usa.yaml is relative to Mihomo's data directory (-d), not this URL.
proxy-providers:
  usa:
    type: file
    path: ./usa.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: default
    type: fallback
    use: [usa]
    empty-fallback: REJECT

rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,public_tracker,REJECT
  - RULE-SET,proxy,default
  - RULE-SET,microsoft,default
  - RULE-SET,china,DIRECT
  - RULE-SET,china_public,DIRECT
  - RULE-SET,china_ip,DIRECT
  - MATCH,default
